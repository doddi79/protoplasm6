name: Run Unit Tests

on:
  push:
    branches:
      - main  # Only run when pushing directly to main
  pull_request:
    branches:
      - '**'  # Run on all pull requests
  workflow_dispatch:  # ...or when run manually

jobs:
  test:
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13", "3.14"]

    steps:
    - uses: actions/checkout@v4
    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v5
      with:
        python-version: ${{ matrix.python-version }}
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements-unittesting.txt
    - name: Install Neobuilder6 (only used to build the test protos)
      # Neobuilder6 depends on protoplasm6 so it's installed without its
      # dependencies, from the branch with the same name in the neobuilder6
      # repo if there is one (for changes spanning both repos) or from main
      env:
        BRANCH: ${{ github.head_ref || github.ref_name }}
      run: |
        REPO=https://github.com/doddi79/neobuilder6.git
        if git ls-remote --exit-code --heads "$REPO" "$BRANCH" > /dev/null; then
          REF="$BRANCH"
        else
          REF=main
        fi
        echo "Installing neobuilder6 from its '$REF' branch"
        pip install --no-deps "neobuilder6 @ git+$REPO@$REF"
    - name: Run tests
      run: |
        python -m unittest discover -v -f ./tests
    - name: Run tests with the legacy dict converter
      env:
        PROTOPLASM6_CONVERTER: dict
      run: |
        python -m unittest discover -v -f ./tests
