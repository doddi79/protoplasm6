name: Publish Python Package

# Runs on any new GitHub release (pre-releases included).
#
# NOTE: Release protoplasm6 BEFORE neobuilder6 (when releasing both) since
# neobuilder6 depends on protoplasm6.

on:
  release:
    types: [ created ]

jobs:
  build-and-publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - name: Install Dependencies
        run: |
          python --version
          python -m pip install --upgrade pip
          pip install --upgrade build twine
          pip install -r requirements-unittesting.txt
      - name: Install Neobuilder6 (only used to build the test protos)
        # From PyPI if a matching release is there, otherwise from main (e.g.
        # for the very first release, or when releasing both packages at once)
        run: |
          pip install --no-deps -r requirements-neobuilder.txt \
            || pip install --no-deps "neobuilder6 @ git+https://github.com/doddi79/neobuilder6.git@main"
      - name: Check that the release tag matches the package version
        env:
          TAG: ${{ github.event.release.tag_name }}
        run: |
          VERSION=$(python -c "import protoplasm6; print(protoplasm6.__version__)")
          echo "Tag: $TAG - Package version: $VERSION"
          if [ "${TAG#v}" != "$VERSION" ]; then
            echo "::error::Release tag $TAG does not match protoplasm6.__version__ $VERSION"
            exit 1
          fi
      - name: Run Unit Tests
        run: |
          python -m unittest discover -v -f ./tests
      - name: Build and Package
        run: |
          pip freeze
          python -m build
          twine check dist/*
      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          user: __token__
          password: ${{ secrets.PYPI_UPLOAD_TOKEN }}
          verbose: true
